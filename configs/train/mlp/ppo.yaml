params:
  seed: 42

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: false               # shared backbone for actor + critic

    space:
      continuous:
        mu_activation: None       # linear output, tanh applied by env clamp
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.0               # log_std = -2 → std ≈ 0.135 (was 1.0).
                                  # Tames 51-DOF delta-pos jitter / contact spikes.
        fixed_sigma: true

    mlp:
      units: [512, 512, 256]      # Upgraded capacity for 119-dim obs / 51-dim act.
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: false

  config:
    name: HandDrag
    full_experiment_name: hand_drag_ppo
    env_name: hand_drag
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true         # running mean/std on observations
    normalize_value: true         # running mean/std on value targets
    value_bootstrap: true         # bootstrap value at timeout (not failure)

    # -- Vectorised env --
    num_actors: 64                # overridden by train.py --num_envs

    # -- Reward shaping --
    reward_shaper:
      scale_value: 1.0

    # -- PPO --
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95                     # GAE lambda
    learning_rate: 3.0e-4
    lr_schedule: adaptive         # adapt LR based on KL divergence
    kl_threshold: 0.008
    score_to_win: 100000
    max_epochs: 5000
    save_best_after: 200
    save_frequency: 500
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2                   # PPO clip ratio
    horizon_length: 32            # 4096 envs × 32 = 131072 batch
    minibatch_size: 32768         # 131072 / 32768 = 4 minibatches per epoch.
                                  # With mini_epochs=5 → 20 grad steps/update.
                                  # Drop to 16384 (8 minibatches) if KL is noisy.
                                  # train.py auto-clamps if num_envs is smaller.
    mini_epochs: 5                # PPO epochs per update
    critic_coef: 1.0              # Was 4.0 — value loss was drowning actor grads.
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.001       # penalise actions near [-1, 1] boundary

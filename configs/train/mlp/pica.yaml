params:
  seed: 42

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: false               # shared backbone for actor + critic

    space:
      continuous:
        mu_activation: None       # linear output, tanh applied by env clamp
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.0               # log_std = -2 -> std ~= 0.135
        fixed_sigma: true

    mlp:
      units: [512, 512, 256]      # Same capacity as flat-history baseline.
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: false

  config:
    name: HandDrag
    full_experiment_name: hand_drag_flat_pica
    env_name: hand_drag
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true         # running mean/std on observations
    normalize_value: true         # running mean/std on value targets
    value_bootstrap: true

    # -- Vectorised env --
    num_actors: 64                # overridden by train.py --num_envs

    # -- Reward shaping --
    reward_shaper:
      scale_value: 1.0

    # -- PPO --
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95                     # GAE lambda
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 100000
    max_epochs: 100               # parity with flat_history_long_bounds01
    save_best_after: 200
    save_frequency: 500
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 32768
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.01        # parity with flat-history_long_bounds01

    # ─────────────────────────────────────────────────────────────────────
    # PICA v1 — same physical regularization block as train_config_gla_pica.
    # Identical defaults so flat-history vs GLA comparisons are not
    # confounded by different env-side reward shaping.
    # ─────────────────────────────────────────────────────────────────────
    physical_regularization:
      enabled: true

      action_bound:
        enabled: true
        threshold: 0.90
        weight: 0.02

      contact_distance:
        enabled: true
        safe_dist: 0.08
        weight: 0.5

      slip_action:
        enabled: false
        weight: 0.0

      action_smoothness:
        enabled: false
        weight: 0.0

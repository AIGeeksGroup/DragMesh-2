params:
  seed: 42

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: gla_actor_critic
    separate: false

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.0
        fixed_sigma: true

    mlp:
      units: [512, 512, 256]
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None

    gla:
      history_length: 16
      token_dim: 102
      hidden_size: 128
      num_heads: 4
      expand_k: 0.5
      expand_v: 1.0
      mode: chunk
      pool: last

  load_checkpoint: false

  config:
    name: HandDrag
    full_experiment_name: hand_drag_gla_pica_drand14
    env_name: hand_drag
    multi_gpu: false
    ppo: true
    mixed_precision: false
    torch_compile: false        # disabled on server: torch-inductor/triton bug
    normalize_input: true
    normalize_value: true
    value_bootstrap: true

    num_actors: 64

    reward_shaper:
      scale_value: 1.0

    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 100000
    max_epochs: 100
    save_best_after: 200
    save_frequency: 500
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 32768
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.01

    physical_regularization:
      enabled: true

      action_bound:
        enabled: true
        threshold: 0.90
        weight: 20.0

      contact_distance:
        enabled: true
        safe_dist: 0.08
        weight: 0.5

      slip_action:
        enabled: false
        weight: 0.0

      action_smoothness:
        enabled: false
        weight: 0.0

    dynamics_randomization:
      enabled: true
      damping_scale:
        enabled: true
        range: [1.0, 4.0]
      friction_scale:
        enabled: false
        range: [1.0, 1.0]

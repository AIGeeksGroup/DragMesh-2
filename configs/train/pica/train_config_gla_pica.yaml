params:
  seed: 42

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    # Custom builder registered by backbones/gla/a2c_network.py:register_gla_network()
    name: gla_actor_critic
    separate: false               # shared backbone for actor + critic

    space:
      continuous:
        mu_activation: None       # linear output, env clamps to [-1, 1]
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.0               # log_std = -2 -> std ~= 0.135
        fixed_sigma: true

    mlp:
      # MLP backbone applied only to base_obs (everything except the last
      # 16 * 102 history block). Keep close to the flat-history baseline
      # so the comparison is "same MLP capacity + GLA on the history".
      units: [512, 512, 256]
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None

    # Phase 4 GLA-specific configuration consumed by GLAA2CBuilder.
    gla:
      history_length: 16          # must match HandDragTask.history_len
      token_dim: 102              # error_t (51) + a_{t-1} (51)
      hidden_size: 128            # GLA inner width
      num_heads: 4                # 128 * 0.5 / 4 = 16 head_k_dim (valid)
      expand_k: 0.5
      expand_v: 1.0
      mode: chunk                 # FLA falls back to fused_recurrent for L<=64
      pool: last                  # 'last' | 'mean'; last = causal summary

  load_checkpoint: false

  config:
    name: HandDrag
    full_experiment_name: hand_drag_gla_pica
    env_name: hand_drag
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true         # running mean/std on observations
    normalize_value: true         # running mean/std on value targets
    value_bootstrap: true

    # -- Vectorised env --
    num_actors: 64                # overridden by train.py --num_envs

    # -- Reward shaping --
    reward_shaper:
      scale_value: 1.0

    # -- PPO --
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95                     # GAE lambda
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 100000
    max_epochs: 100               # baseline parity with bounds01 long runs
    save_best_after: 200
    save_frequency: 500
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 32768         # train.py auto-clamps if num_envs is smaller
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: true
    seq_length: 4
    # Same regularisation budget as the strong flat-history baseline so the
    # PICA delta is purely from the env-side physical regularization, not
    # from a different bounds penalty in the PPO loss.
    bounds_loss_coef: 0.01

    # ─────────────────────────────────────────────────────────────────────
    # PICA v1 — physical behavior regularization (env-side reward terms).
    # All weights default to 0.0 in code; setting `enabled: true` and a
    # non-zero `weight` activates each individual term. Initial weights
    # are intentionally conservative; expect to retune once smoke-test
    # magnitudes are inspected against r_task / r_act baselines.
    # ─────────────────────────────────────────────────────────────────────
    physical_regularization:
      enabled: true

      # 1. Saturation penalty: -w * mean(max(0, |a| - threshold)^2).
      action_bound:
        enabled: true
        threshold: 0.90
        weight: 0.02

      # 2. Contact-margin penalty: -w * max(0, palm_handle_dist - safe_dist)^2.
      contact_distance:
        enabled: true
        safe_dist: 0.08
        weight: 0.5

      # 3. Slip-aware action penalty: disabled by default in v1.
      slip_action:
        enabled: false
        weight: 0.0

      # 4. Action smoothness penalty: disabled by default in v1.
      action_smoothness:
        enabled: false
        weight: 0.0

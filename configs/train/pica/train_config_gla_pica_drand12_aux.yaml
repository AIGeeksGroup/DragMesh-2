params:
  seed: 42

  algo:
    # Custom subclass registered by pica/a2c_agent.py:register_pica_a2c_agent.
    # train.py auto-registers when this name is detected before runner.load().
    name: pica_a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: gla_actor_critic
    separate: false

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.0
        fixed_sigma: true

    mlp:
      units: [512, 512, 256]
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None

    gla:
      history_length: 16
      token_dim: 102
      hidden_size: 128
      num_heads: 4
      expand_k: 0.5
      expand_v: 1.0
      mode: chunk
      pool: last

    # `phys_aux` is auto-populated by train.py from
    # config.physical_auxiliary (single source of truth).

  load_checkpoint: false

  config:
    name: HandDrag
    full_experiment_name: hand_drag_gla_pica_drand12_aux
    env_name: hand_drag
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true

    num_actors: 64

    reward_shaper:
      scale_value: 1.0

    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 100000
    max_epochs: 100
    save_best_after: 200
    save_frequency: 500
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 32768
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.01

    # PICA v1 (calibrated)
    physical_regularization:
      enabled: true

      action_bound:
        enabled: true
        threshold: 0.90
        weight: 20.0

      contact_distance:
        enabled: true
        safe_dist: 0.08
        weight: 0.5

      slip_action:
        enabled: false
        weight: 0.0

      action_smoothness:
        enabled: false
        weight: 0.0

    # PICA v2a (drand12)
    dynamics_randomization:
      enabled: true
      damping_scale:
        enabled: true
        range: [1.0, 2.0]
      friction_scale:
        enabled: false
        range: [1.0, 1.0]

    # ─────────────────────────────────────────────────────────────────────
    # PICA v2b — physical auxiliary targets + aux head on GLA temporal_feat.
    #
    # Three regression targets are appended to the obs tail by HandDragTask
    # and sliced off by GLAA2CBuilder.Network before the actor / critic /
    # GLA-history paths. Aux loss is plain MSE in the (RunningMeanStd-
    # normalized) target space; the contact_gate is computed for debug
    # logging only and is NOT used as a loss weight in v2b-init.
    #
    # Conservative warmup: aux contribution is exactly 0 for the first 10
    # epochs (PPO behaves bit-identically to v2a), then ramps linearly to
    # max_weight=0.01 by epoch 40.
    # ─────────────────────────────────────────────────────────────────────
    physical_auxiliary:
      enabled: true
      targets:
        dq_obj:          { enabled: true }
        slip_proxy:      { enabled: true }
        tracking_stress: { enabled: true }
      gating:
        # Computed but NOT applied to the loss in v2b-init (z-score issue).
        enabled: true
        d_valid: 0.10
        sharpness: 80.0
      warmup:
        enabled: true
        start_epoch: 10
        end_epoch:   40
        max_weight:  0.01

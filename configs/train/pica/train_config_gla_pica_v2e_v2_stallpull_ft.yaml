params:
  seed: 42

  algo:
    name: pica_a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: gla_actor_critic
    separate: false

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.0
        fixed_sigma: true

    mlp:
      units: [512, 512, 256]
      activation: elu
      initializer:
        name: default
      regularizer:
        name: None

    gla:
      history_length: 16
      token_dim: 102
      hidden_size: 128
      num_heads: 4
      expand_k: 0.5
      expand_v: 1.0
      mode: chunk
      pool: last

  load_checkpoint: false  # pass --checkpoint <best_v2c150_v2d50_ft.pth>

  config:
    name: HandDrag
    full_experiment_name: hand_drag_gla_pica_v2e_v2_stallpull_ft
    env_name: hand_drag
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true

    num_actors: 64

    reward_shaper:
      scale_value: 1.0

    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.006
    score_to_win: 100000
    max_epochs: 15
    save_best_after: 0
    save_frequency: 5
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.15
    horizon_length: 32
    minibatch_size: 32768
    mini_epochs: 4
    critic_coef: 1.0
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.005

    task_progress_observation:
      enabled: true

    # Restore v2d-style action_bound to prevent saturation creep that v2e_FT5
    # showed (clip099 0.75 -> 0.98 in 5 epochs). The stall-pull reward still
    # rewards real wrist motion along ref_dir, so action saturation is not
    # required to earn it.
    physical_regularization:
      enabled: true
      action_bound:
        enabled: true
        threshold: 0.90
        weight: 18.0
      contact_distance:
        enabled: true
        safe_dist: 0.08
        weight: 0.5
      slip_action:
        enabled: false
        weight: 0.0
      action_smoothness:
        enabled: false
        weight: 0.0

    # Force the policy into the regime stall-pull is designed for: damp >= 2.
    # v2e_FT5 trained on [1.0, 2.5] never saw a stall (gate_rate == 0 for all
    # 5 epochs), so the stall-pull signal was dormant.
    dynamics_randomization:
      enabled: true
      damping_scale:
        enabled: true
        range: [2.0, 4.0]
      friction_scale:
        enabled: false
        range: [1.0, 1.0]

    physical_auxiliary:
      enabled: true
      mode: causal_horizon
      horizon: 5
      targets:
        q_response_K:    { enabled: true }
        max_dist_K:      { enabled: true }
        detach_proxy_K:  { enabled: true }
        tracking_stress: { enabled: true }
      weights:
        q_response_K:    1.0
        max_dist_K:      1.0
        detach_proxy_K:  0.5
        tracking_stress: 0.5
      gating:
        enabled: false
        d_valid: 0.10
        sharpness: 80.0
      warmup:
        enabled: true
        start_epoch: 0
        end_epoch:   10
        max_weight:  0.01

    # Re-enable ARAM as a saturation brake, but delayed: it should only engage
    # once success_mean exceeds start_after_success, leaving stall-pull free to
    # shape early-FT behaviour without competing with ARAM's effort penalty.
    aram:
      enabled: true
      start_after_success: 0.85
      target_clip:         0.85
      lambda_lr:           0.003
      lambda_max:          1.0
      lambda_init:         0.0
      resistance_gate:
        enabled:         true
        min_action_l2:   1.0
        min_stall_steps: 5
        q_response_min:  0.005
        contact_dist:    0.10

    reconfig_reward:
      enabled: false

    # Slightly relaxed gate so it can actually fire on short episodes:
    # q_response_min 0.003 -> 0.005, min_stall_steps 4 -> 3.
    stall_pull_reward:
      enabled: true
      contact_dist: 0.10
      q_response_min: 0.005
      min_stall_steps: 3
      stall_pull_window: 8
      weight_pull: 4.0
      weight_response: 8.0
      max_dist_increase: 0.005
      action_delta_threshold: 2.0
      hand_velocity_threshold: 8.0
